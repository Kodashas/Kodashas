name: profile
on:
  schedule: [{ cron: "*/30 * * * *" }]
  workflow_dispatch:
  push: { branches: [main] }
permissions:
  contents: write
concurrency: { group: profile, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Live window
        run: node .github/scripts/now.mjs
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#2F7CFF
            dist/snake-light.svg?palette=github-light&color_snake=#2F7CFF
      - uses: yoshi389111/github-profile-3d-contrib@v0.9.3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
      - name: Collect 3D graphs
        run: |
          ls profile-3d-contrib
          cp profile-3d-contrib/profile-night-view.svg dist/3d-dark.svg
          cp profile-3d-contrib/profile-gitblue.svg dist/3d-light.svg
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
